<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Yükleniyor…</title>
<link
  id="dynamic-favicon"
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2322c55e'%3E%3Ccircle cx='12' cy='12' r='12'/%3E%3C/svg%3E"
/>

<!-- Tailwind (CDN, build aracı yok) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide ikonları (CDN) -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-dvh flex items-center justify-center">

  <!-- Arkaplan: render sırasında buraya tema gradyanı eklenir -->
  <div id="bg-container" aria-hidden="true"></div>

  <!-- Yükleniyor durumu -->
  <div id="loading-state" class="w-full flex flex-col items-center justify-center gap-3 text-white/80 px-4 py-10">
    <div class="loader-spinner"></div>
    <p class="text-sm">Yükleniyor…</p>
  </div>

  <!-- Sayfa bulunamadı durumu -->
  <div id="not-found-state" class="hidden w-full flex flex-col items-center justify-center px-4 py-10">
    <div class="glass-panel w-full max-w-[380px] rounded-3xl p-8 flex flex-col items-center gap-3 text-center">
      <div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 border border-white/15">
        <i data-lucide="search-x" class="w-6 h-6 text-white/70"></i>
      </div>
      <h1 class="text-lg font-semibold">Sayfa Bulunamadı</h1>
      <p id="not-found-message" class="text-sm text-white/70"></p>
    </div>
  </div>

  <!-- Bio sayfası içeriği -->
  <main id="page-content" class="hidden relative w-full max-w-[420px] flex flex-col items-center gap-6 px-4 py-10 sm:py-14">
    <header class="flex flex-col items-center gap-3 text-center">
      <div id="logo-wrap" class="logo-ring w-24 h-24 rounded-full flex items-center justify-center overflow-hidden">
        <img id="logo-img" src="" alt="" class="w-full h-full object-cover hidden" />
        <span id="logo-fallback" class="text-3xl font-bold hidden"></span>
      </div>
      <div>
        <h1 id="business-name" class="text-xl sm:text-2xl font-semibold tracking-tight drop-shadow-sm"></h1>
        <p id="tagline" class="text-sm text-white/70 mt-1"></p>
      </div>
    </header>

    <nav id="link-list" class="glass-panel w-full rounded-3xl p-3 sm:p-4 flex flex-col gap-3"></nav>

    <footer class="footer-fade text-[11px] text-white/60 mt-2">
      &copy; <span id="footer-year"></span> <span id="footer-name"></span>
    </footer>
  </main>

  <script>
    // Backend API'nin adresi. Production'da kendi backend URL'inizle değiştirin.
    const API_BASE_URL = "http://localhost:8000";

    function resolveSlug() {
      const params = new URLSearchParams(location.search);
      if (params.get("slug")) return params.get("slug");
      const path = location.pathname.replace(/^\/+|\/+$/g, "");
      // index.html'e doğrudan erişimde slug yok say
      if (!path || path.toLowerCase() === "index.html") return null;
      return path.split("/")[0];
    }

    function showState(id) {
      ["loading-state", "not-found-state", "page-content"].forEach((s) => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    // Tek bir tema rengini gradyan için iki tona ayırır (hue kaydırma).
    function deriveSecondaryColor(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
      if (!m) return "#0ea5e9";
      const n = parseInt(m[1], 16);
      const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          default: h = (r - g) / d + 4;
        }
        h *= 60;
      }
      const newHue = (h + 40) % 360;
      return `hsl(${newHue.toFixed(0)} ${(s * 100).toFixed(0)}% ${Math.max(15, l * 100 - 10).toFixed(0)}%)`;
    }

    const toPascalCase = (str) =>
      str.replace(/(^[a-z]|-[a-z])/g, (m) => m.replace("-", "").toUpperCase());

    // Lucide'de bulunmayan marka logoları (instagram, tiktok, whatsapp, x, vb.)
    // için otomatik olarak Simple Icons CDN'ine düşer.
    function iconMarkup(name) {
      const iconName = name || "link";
      const isLucideIcon =
        window.lucide && window.lucide.icons && window.lucide.icons[toPascalCase(iconName)];
      if (isLucideIcon) {
        return `<i data-lucide="${iconName}" class="w-[18px] h-[18px]"></i>`;
      }
      return `<img src="https://cdn.simpleicons.org/${iconName}/ffffff" alt="" class="w-[18px] h-[18px]" loading="lazy" onerror="this.style.visibility='hidden'" />`;
    }

    function renderPage(data) {
      const primary = data.theme_color || "#22c55e";
      const secondary = deriveSecondaryColor(primary);
      document.documentElement.style.setProperty("--color-primary", primary);
      document.documentElement.style.setProperty("--color-secondary", secondary);

      const bgContainer = document.getElementById("bg-container");
      bgContainer.innerHTML = "";
      const gradient = document.createElement("div");
      gradient.className = "bg-gradient-theme";
      bgContainer.appendChild(gradient);

      const businessName = data.business_name || "İşletme";
      document.title = businessName;
      document.getElementById("business-name").textContent = businessName;

      const taglineEl = document.getElementById("tagline");
      if (data.tagline) {
        taglineEl.textContent = data.tagline;
        taglineEl.classList.remove("hidden");
      } else {
        taglineEl.classList.add("hidden");
      }

      const logoImg = document.getElementById("logo-img");
      const logoFallback = document.getElementById("logo-fallback");
      const faviconEl = document.getElementById("dynamic-favicon");
      if (data.logo_url) {
        logoImg.src = data.logo_url;
        logoImg.alt = businessName;
        logoImg.classList.remove("hidden");
        logoFallback.classList.add("hidden");
        logoImg.addEventListener("error", () => {
          logoImg.classList.add("hidden");
          logoFallback.textContent = businessName.trim().charAt(0).toUpperCase();
          logoFallback.classList.remove("hidden");
        });
        faviconEl.setAttribute("href", data.logo_url);
      } else {
        logoFallback.textContent = businessName.trim().charAt(0).toUpperCase();
        logoFallback.classList.remove("hidden");
      }

      const list = document.getElementById("link-list");
      const links = Array.isArray(data.links) ? data.links : [];
      list.innerHTML = links
        .map(
          (link, i) => `
        <a
          href="${encodeURI(link.url || "#")}"
          target="_blank"
          rel="noopener noreferrer"
          class="link-btn"
          style="animation-delay:${i * 70}ms"
        >
          <span class="link-icon">
            ${iconMarkup(link.icon)}
          </span>
          <span class="link-label">${link.label || ""}</span>
          <i data-lucide="arrow-up-right" class="link-arrow w-4 h-4"></i>
        </a>`
        )
        .join("");

      document.getElementById("footer-year").textContent = new Date().getFullYear();
      document.getElementById("footer-name").textContent = businessName;

      if (window.lucide) lucide.createIcons();
      showState("page-content");
    }

    async function loadBioPage() {
      const slug = resolveSlug();
      if (!slug) {
        document.getElementById("not-found-message").textContent =
          "Bu adreste tanımlı bir bağlantı sayfası yok.";
        showState("not-found-state");
        if (window.lucide) lucide.createIcons();
        return;
      }

      showState("loading-state");
      try {
        const res = await fetch(`${API_BASE_URL}/api/bio/${encodeURIComponent(slug)}`);
        if (res.status === 404) {
          document.getElementById("not-found-message").textContent =
            `"${slug}" adında bir sayfa bulunamadı.`;
          showState("not-found-state");
          if (window.lucide) lucide.createIcons();
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderPage(data);
      } catch (err) {
        document.getElementById("not-found-message").textContent =
          "Sayfa yüklenirken bir hata oluştu. Lütfen daha sonra tekrar deneyin.";
        showState("not-found-state");
        if (window.lucide) lucide.createIcons();
      }
    }

    loadBioPage();
  </script>
</body>
</html>
